name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  website:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Bazelisk
        run: npm install --global @bazel/bazelisk
      - name: Check and build
        run: |
          bazelisk test //packages/website:check //packages/website:style_contract_test
          bazelisk build //packages/website:pages_deploy
      - name: Deploy prebuilt site
        # Cloudflare publishing is suspended; keep checks and builds running.
        if: ${{ false }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy bazel-bin/packages/website/pages_deploy --project-name=hyperdb --branch=main --commit-hash=${{ github.sha }}
